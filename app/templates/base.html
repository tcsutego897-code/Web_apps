<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('datasets') }}">{{ app_name }}</a>
    <nav class="site-nav" aria-label="メインメニュー">
      <a href="{{ url_for('datasets') }}" {% if request.url.path == "/" %}aria-current="page"{% endif %}>データセット</a>
      <a href="{{ url_for('search') }}" {% if request.url.path == "/search" %}aria-current="page"{% endif %}>検索・閲覧</a>
      {% if current_user and current_user.role == "importer" %}
        <a href="{{ url_for('import_page') }}" {% if request.url.path == "/import" %}aria-current="page"{% endif %}>Excel取り込み</a>
      {% endif %}
      {% if current_user %}
        <span class="account-label">{{ current_user.email }}</span>
        <form class="logout-form" action="{{ url_for('logout') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="nav-logout" type="submit">ログアウト</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}" {% if request.url.path == "/login" %}aria-current="page"{% endif %}>ログイン</a>
        <a href="{{ url_for('register') }}" {% if request.url.path == "/register" %}aria-current="page"{% endif %}>新規登録</a>
      {% endif %}
    </nav>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">{{ app_name }}</footer>
  <script>
    document.querySelectorAll("form[data-loading-message]").forEach((form) => {
      form.addEventListener("submit", (event) => {
        if (form.dataset.submitting === "true") {
          event.preventDefault();
          return;
        }

        form.dataset.submitting = "true";
        form.setAttribute("aria-busy", "true");
        const status = form.querySelector(".form-status");
        if (status) {
          status.textContent = form.dataset.loadingMessage;
          status.hidden = false;
        }

        form
          .querySelectorAll('button[type="submit"], input[type="submit"]')
          .forEach((button) => {
            button.disabled = true;
            if (button instanceof HTMLButtonElement && button.dataset.loadingLabel) {
              button.textContent = button.dataset.loadingLabel;
            }
            if (button instanceof HTMLInputElement && button.dataset.loadingLabel) {
              button.value = button.dataset.loadingLabel;
            }
          });
      });
    });
  </script>
</body>
</html>
