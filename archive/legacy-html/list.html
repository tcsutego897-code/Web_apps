<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>登録データ一覧</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin: 20px 0; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <h1>登録ユーザー一覧</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>名前</th>
            <th>メールアドレス</th>
        </tr>
        <!-- サーバープログラムがここにデータベースのデータを差し込みます -->
        <tr>
            <td>1</td>
            <td>山田 太郎</td>
            <td>taro@example.com</td>
        </tr>
        <tr>
            <td>2</td>
            <td>佐藤 花子</td>
            <td>hanako@example.com</td>
        </tr>
    </table>
</body>
</html>
